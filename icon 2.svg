  <rect x="172" y="262" width="168" height="12" rx="6" fill="#FFFFFF" opacity="0.7"/>
  <rect x="172" y="296" width="120" height="12" rx="6" fill="#FFFFFF" opacity="0.7"/>

  <!-- Checkmark circle (bottom right) -->
