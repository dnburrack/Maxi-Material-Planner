<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#1C2B4A"/>

  <!-- Clipboard body -->
  <rect x="130" y="155" width="252" height="290" rx="18" fill="#FFFFFF" opacity="0.12"/>
  <rect x="130" y="155" width="252" height="290" rx="18" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.35"/>

  <!-- Clipboard top clip -->
  <rect x="206" y="135" width="100" height="46" rx="14" fill="#E8A020"/>
